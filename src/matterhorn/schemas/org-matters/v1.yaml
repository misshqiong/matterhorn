schema: org-matters/v1
subjects:
  - type: MATTER
    primary: true
  - type: TOPIC
  - type: DECISION_SLOT
    parent: MATTER
handle_patterns:
  - handle_type: issue
    pattern: '(?<![A-Za-z0-9_-])[A-Z][A-Z0-9]{1,9}-0*[1-9][0-9]{0,8}(?![A-Za-z0-9_-])'
  - handle_type: pull_request
    pattern: '(?:(?<![A-Za-z0-9_])(?i:(?:PR|MR))\s*#\s*0*[1-9][0-9]{0,8}|(?<!\w)!0*[1-9][0-9]{0,8})(?!\w)'
    normalization:
      strip_prefixes: [PR, MR]
      strip_leading_zeros: true
  - handle_type: order
    pattern: '(?<![A-Za-z0-9_])(?:(?i:order)|订单)\s*(?:#\s*)?0*[1-9][0-9]{3,11}(?![A-Za-z0-9])'
    normalization:
      strip_prefixes: [order, 订单]
      strip_leading_zeros: true
  - handle_type: invoice
    pattern: '(?<![A-Za-z0-9_])(?i:invoice)\s+(?:#\s*)?(?:INV-)?[A-Z0-9]+(?:-[A-Z0-9]+)+(?![A-Za-z0-9_-])'
    normalization:
      strip_prefixes: [invoice]
  - handle_type: flight
    pattern: '(?<![A-Za-z0-9_-])(?i:[A-Z]{2})[1-9][0-9]{2,3}(?![A-Za-z0-9_-])'
  - handle_type: message_id
    pattern: '(?<![A-Za-z0-9_])(?i:(?:RFC\s+)?Message-ID)\s*:\s*<[^<>\s@]+@[^<>\s@]+>'
    normalization:
      strip_prefixes: [RFC Message-ID, Message-ID]
  - handle_type: thread_id
    pattern: '(?<![A-Za-z0-9_])(?i:Thread-ID)\s*:\s*[^\s<>"'']{3,128}'
    normalization:
      strip_prefixes: [Thread-ID]
predicates:
  - name: status
    subject: MATTER
    cardinality: SINGLE
    extraction: deterministic
    retract_guard: explicit
    source_field: status
    value_domain:
      [open, in_progress, blocked, paused, pending, ready, done, completed, closed]
  - name: owned_by
    subject: MATTER
    cardinality: SET
    extraction: deterministic
    object: person
    source_field: participants
    extraction_rule: participant_ids
    role_filter: [owner]
  - name: participated_by
    subject: MATTER
    cardinality: SET
    extraction: deterministic
    object: person
    source_field: participants
    extraction_rule: participant_ids
  - name: blocked_by
    subject: MATTER
    cardinality: SET
    extraction: deterministic
    retract_guard: explicit
    source_field: blocker
  - name: next_step
    subject: MATTER
    cardinality: SINGLE
    extraction: deterministic
    retract_guard: explicit
    source_field: next_step
  - name: due_at
    subject: MATTER
    cardinality: SINGLE
    extraction: deterministic
    retract_guard: never
    object: datetime
    source_field: due
  - name: progress
    subject: MATTER
    cardinality: APPEND
    extraction: deterministic
    retract_guard: never
    source_field: progress
  - name: outcome
    subject: MATTER
    cardinality: APPEND
    extraction: deterministic
    retract_guard: never
    object: object
    source_field: outcome
  - name: part_of
    subject: MATTER
    cardinality: SINGLE
    extraction: semantic
    object: subject
  - name: akin_to
    subject: MATTER
    cardinality: SET
    extraction: semantic
    object: subject
  - name: gathers
    subject: MATTER
    cardinality: SET
    extraction: semantic
    object: subject
    subject_layer_min: 2
    cross_scope: true
  - name: spawned_from
    subject: MATTER
    cardinality: SINGLE
    extraction: semantic
    object: subject
  - name: decision
    subject: MATTER
    cardinality: APPEND
    extraction: semantic
    retract_guard: never
    object: string
  - name: viewpoint
    subject: TOPIC
    cardinality: APPEND
    extraction: semantic
    retract_guard: never
    object: object
    retractable: true
    field_domains:
      stance: [supports, opposes, neutral, informs]
  - name: stated_by
    subject: TOPIC
    cardinality: SET
    extraction: semantic
    object: person
  - name: decision_adopted
    subject: DECISION_SLOT
    cardinality: SINGLE
    extraction: semantic
    semantic_filter: conservative
    object: boolean
    value_domain: [true, false]
semantic:
  conservative_confidence_threshold: 0.8
completion:
  predicate: status
  completed_values: [done, completed, closed]
identity:
  degenerate_titles: ["总结", "讨论", "无实质内容", "summary", "discussion", "untitled"]
  merge_evidence:
    min_shared_sources: 2
    or_share_ratio: 0.5
