name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install '.[dev]'
      - run: ruff check src tests

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install '.[api,mcp,dev]'
      - run: python -m pytest -q

  postgres-conformance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: matterhorn
          POSTGRES_USER: matterhorn
          POSTGRES_PASSWORD: matterhorn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U matterhorn -d matterhorn"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      MATTERHORN_TEST_POSTGRES_DSN: postgresql://matterhorn:matterhorn@127.0.0.1:5432/matterhorn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install '.[postgres,dev]'
      - name: Required cross-backend conformance gate
        run: python -m pytest -q tests/test_conformance.py
