name: Development ledger

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ledger:
    runs-on: ubuntu-latest
    env:
      MATTERHORN_PROVIDER: ${{ secrets.MATTERHORN_PROVIDER }}
      MATTERHORN_BASE_URL: ${{ secrets.MATTERHORN_BASE_URL }}
      MATTERHORN_MODEL: ${{ secrets.MATTERHORN_MODEL }}
      MATTERHORN_API_KEY: ${{ secrets.MATTERHORN_API_KEY }}
      MATTERHORN_TIMEOUT: ${{ secrets.MATTERHORN_TIMEOUT }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require write-gateway secrets
        shell: bash
        run: |
          missing=0
          for name in \
            MATTERHORN_PROVIDER \
            MATTERHORN_BASE_URL \
            MATTERHORN_MODEL \
            MATTERHORN_API_KEY \
            MATTERHORN_TIMEOUT
          do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required GitHub secret ${name} is not configured"
              missing=1
            fi
          done
          if [[ "${missing}" -ne 0 ]]; then
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Matterhorn
        run: python -m pip install -e '.[api]'

      - name: Rebuild projection database
        shell: bash
        run: |
          mkdir -p ledger
          rm -f ledger/dev.db
          if [[ -f ledger/assertions.json ]]; then
            mh import ledger/assertions.json --db ledger/dev.db
          fi

      - name: Fill ledger incrementally
        run: >-
          python scripts/ledger_fill.py
          --db ledger/dev.db
          --scope dev
          --batch-size 8

      - name: Export durable assertions and Markdown
        shell: bash
        run: |
          mh export dev --format json \
            --out ledger/assertions.json --db ledger/dev.db
          mh export dev --format markdown \
            --out MATTERS.md --db ledger/dev.db

      - name: Commit changed ledger assets
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- ledger/ MATTERS.md)" ]]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledger/ MATTERS.md
          git commit -m "ledger: nightly update"
          git push
