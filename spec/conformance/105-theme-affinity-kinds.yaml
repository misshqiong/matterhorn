case_id: theme-affinity-kinds
title: Theme clustering bonds on handles and titles; venues only confirm
invariants: [INV-21]
schema_profile:
  schema: fictional-themes/v1
  subjects:
    - {type: MATTER, primary: true}
  handle_patterns:
    - handle_type: kind_a
      pattern: '(?<![A-Za-z0-9])A-0*[1-9][0-9]*(?![A-Za-z0-9])'
      normalization: {strip_prefixes: [A], strip_leading_zeros: true}
    - handle_type: kind_b
      pattern: '(?<![A-Za-z0-9])B-0*[1-9][0-9]*(?![A-Za-z0-9])'
      normalization: {strip_prefixes: [B], strip_leading_zeros: true}
    - handle_type: kind_c
      pattern: '(?<![A-Za-z0-9])C-0*[1-9][0-9]*(?![A-Za-z0-9])'
      normalization: {strip_prefixes: [C], strip_leading_zeros: true}
  predicates:
    - {name: status, subject: MATTER, cardinality: SINGLE, extraction: deterministic, source_field: status, value_domain: [open, completed]}
    - {name: part_of, subject: MATTER, cardinality: SINGLE, extraction: semantic, object: subject}
    - {name: spawned_from, subject: MATTER, cardinality: SINGLE, extraction: semantic, object: subject}
    - {name: decision, subject: MATTER, cardinality: APPEND, extraction: semantic}
  completion: {predicate: status, completed_values: [completed]}
