# Corrections run before merge operations in the harness, so the tree
# exists by the time the merge door is exercised.
corrections:
  - {scope_id: octo-merge-cycle, subject_key: left, subject_type: MATTER, predicate: part_of, operation: ASSERT, object_value: bridge, valid_from: "2026-08-07T09:10:00Z", source_refs: [{source_id: review:left-bridge, sent_at: "2026-08-07T09:10:00Z", sender: Dana Reyes}]}
  - {scope_id: octo-merge-cycle, subject_key: bridge, subject_type: MATTER, predicate: part_of, operation: ASSERT, object_value: right, valid_from: "2026-08-07T09:20:00Z", source_refs: [{source_id: review:bridge-right, sent_at: "2026-08-07T09:20:00Z", sender: Dana Reyes}]}
merge_operations:
  # Retargeting bridge -> right onto the survivor would mint
  # left -> bridge -> left; the merge door rejects the mint and no merge
  # lands. (The repairing direction — merging so the collapsed edge voids —
  # is covered by unit tests; replay re-applies corrections, so this case
  # keeps every correction valid post-merge by applying none.)
  - operation: merge
    source_subject_key: right
    target_subject_key: left
    valid_from: "2026-08-07T09:30:00Z"
    source_refs: [{source_id: review:merge-right-left, sent_at: "2026-08-07T09:30:00Z", sender: Dana Reyes}]
    expect_error: STRUCTURE_CYCLE
