services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: matterhorn
      POSTGRES_USER: matterhorn
      POSTGRES_PASSWORD: matterhorn
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matterhorn -d matterhorn"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - matterhorn-data:/var/lib/postgresql/data

  api:
    build:
      context: ../..
      target: runtime
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - mh
      - serve
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --db
      - postgresql://matterhorn:matterhorn@postgres:5432/matterhorn
    ports:
      - "8000:8000"

volumes:
  matterhorn-data:
